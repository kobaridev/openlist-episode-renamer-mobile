# Build the Flutter release APK on GitHub (signed with the debug keystore
# committed in flutter/android/app/debug.keystore, so a CI-built APK
# installs over local builds) and publish it to a draft GitHub Release.
#
# NOTE: release, not debug — a debug APK is ~160 MB (three ABIs' engines
# plus a ~100 MB JIT kernel blob, uncompressed); the release build
# compiles AOT and strips symbols. Split per ABI so each APK only
# carries one architecture (~18 MB for arm64-v8a instead of a ~50 MB
# fat APK).
name: Build Flutter APK

on:
  push:
    branches: [main, master]
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^version:' flutter/pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # The ubuntu image already ships an Android SDK; just install the
      # packages this project needs (setup-android@v3 fails: it tries to
      # install the removed legacy "tools" package).
      - name: Install SDK packages
        run: |
          ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)
          test -n "$SDKMANAGER" || { echo "sdkmanager not found under $ANDROID_HOME"; exit 1; }
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          # compileSdk 36 (Flutter 3.50); platform 35 + CMake 3.22.1 are
          # needed by the jni plugin's Android project; NDK r28c is the
          # version the Flutter plugin demands.
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;28.2.13676358"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'
          cache: true

      - name: Build release APKs (split per ABI)
        working-directory: flutter
        run: |
          flutter --version
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Verify APKs
        run: |
          ls -lh flutter/build/app/outputs/flutter-apk/
          for APK in flutter/build/app/outputs/flutter-apk/app-*-release.apk; do
            test -f "$APK" || { echo "APK not found: $APK"; exit 1; }
            "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | grep -E "^package:"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: OpenListRenamer-flutter-apk
          path: flutter/build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: OpenList 影视重命名 v${{ steps.version.outputs.version }} (Flutter)
          draft: true
          files: |
            flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            flutter/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            flutter/build/app/outputs/flutter-apk/app-x86_64-release.apk
