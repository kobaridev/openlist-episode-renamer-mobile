# Build the debug APK on GitHub (signed with the debug keystore committed in
# android/app/debug.keystore, so a CI-built APK installs over local builds).
name: Build APK

on:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # The ubuntu image already ships an Android SDK; just install the
      # packages this project needs (setup-android@v3 fails: it tries to
      # install the removed legacy "tools" package).
      - name: Install SDK packages
        run: |
          ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)
          test -n "$SDKMANAGER" || { echo "sdkmanager not found under $ANDROID_HOME"; exit 1; }
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "APK not found"; exit 1; }
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" | grep -E "^package:"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenListRenamer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
