# Build unsigned Flutter IPA on a cloud Mac (for sideloading via SideStore / AltStore)
name: Build Flutter IPA

on:
  push:
    branches: [main, master]
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter-ipa.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^version:' flutter/pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode
          # Default Xcode first: its simulator runtimes match the image.
          sudo xcode-select -s /Applications/Xcode.app 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'
          cache: true

      - name: Build IPA (unsigned, for sideloading)
        working-directory: flutter
        run: |
          flutter --version
          flutter pub get
          flutter build ipa --release --no-codesign

      - name: Package IPA
        # Flutter 3.50 with --no-codesign builds the .xcarchive but skips
        # the .ipa ("Codesigning disabled with --no-codesign, skipping IPA"),
        # so package it from the archive the same way the native workflow does.
        run: |
          APP=$(find flutter/build/ios/archive/Runner.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          echo "App bundle: $APP"
          test -n "$APP" || { echo "No .app found in archive"; exit 1; }
          test -f "$APP/Info.plist" || { echo "Info.plist missing — build did not produce a real app"; exit 1; }
          test -f "$APP/Runner" || { echo "App executable missing — build did not produce a real app"; exit 1; }
          rm -rf Payload OpenListRenamer-flutter.ipa
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r OpenListRenamer-flutter.ipa Payload
          ls -la OpenListRenamer-flutter.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenListRenamer-flutter-ipa
          path: OpenListRenamer-flutter.ipa
          if-no-files-found: error

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: OpenList 影视重命名 v${{ steps.version.outputs.version }} (Flutter)
          draft: true
          files: OpenListRenamer-flutter.ipa
