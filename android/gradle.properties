android.useAndroidX=true
kotlin.code.style=official

org.gradle.daemon=false
org.gradle.workers.max=2
kotlin.incremental=false
org.gradle.caching=false
kotlin.compiler.execution.strategy=in-process
systemProp.org.gradle.internal.repository.max.retries=8
systemProp.org.gradle.internal.repository.initial.backoff=500
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
org.gradle.parallel=false
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# GitHub runners: Java prefers IPv6 but IPv6 egress is restricted;
# without this, Gradle cannot reach Maven hosts (curl works because it
# falls back to IPv4, Gradle's HTTP client does not).
systemProp.java.net.preferIPv4Stack=true
